<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Order Completed</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style>
        /* Reset */
        body, table, td, a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        table, td {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        img {
            -ms-interpolation-mode: bicubic;
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            height: 100% !important;
            background-color: #0f1923;
        }

        /* Outlook fix */
        table {
            border-collapse: collapse !important;
        }

        /* Mobile */
        @media only screen and (max-width: 620px) {
            .email-container {
                width: 100% !important;
                max-width: 100% !important;
            }

            .content-padding {
                padding: 28px 20px !important;
            }

            .hero-padding {
                padding: 36px 20px 28px !important;
            }

            .mobile-center {
                text-align: center !important;
            }

            .mobile-full {
                width: 100% !important;
                display: block !important;
            }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #0f1923; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">

<!-- Outer wrapper -->
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #0f1923;">
    <tr>
        <td align="center" style="padding: 32px 16px;">

            <!-- Email container -->
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="560" class="email-container"
                   style="max-width: 560px; width: 100%; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.3);">

                <!-- Header / Hero -->
                <tr>
                    <td class="hero-padding"
                        style="background: linear-gradient(135deg, #0d9f6e 0%, #065f46 50%, #064e3b 100%); padding: 48px 40px 36px; text-align: center;">

                        <!-- Icon -->
                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center">
                            <tr>
                                <td style="width: 64px; height: 64px; border-radius: 50%; background-color: rgba(255,255,255,0.15); text-align: center; vertical-align: middle; font-size: 28px; line-height: 64px;">
                                    &#10003;
                                </td>
                            </tr>
                        </table>

                        <h1 style="margin: 20px 0 8px; font-size: 26px; font-weight: 700; color: #ffffff; letter-spacing: -0.3px; line-height: 1.2;">
                            Order Confirmed
                        </h1>
                        <p style="margin: 0; font-size: 15px; color: rgba(255,255,255,0.8); line-height: 1.5;">
                            Thank you for your purchase!
                        </p>
                    </td>
                </tr>

                <!-- Body -->
                <tr>
                    <td class="content-padding" style="background-color: #1a2735; padding: 36px 40px;">

                        <!-- Order ID card -->
                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%"
                               style="background-color: #0f1923; border-radius: 8px; border: 1px solid #2a3a4a; margin-bottom: 24px;">
                            <tr>
                                <td style="padding: 20px 24px;">
                                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                        <tr>
                                            <td style="padding-bottom: 4px;">
                                                <span style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #0d9f6e;">Order Reference</span>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>
                                                <span style="font-size: 15px; color: #e8edf2; font-weight: 500; font-family: 'Courier New', Courier, monospace; letter-spacing: 0.5px;">{{orderId}}</span>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>

                        <!-- Products header -->
                        <p style="margin: 0 0 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #0d9f6e;">
                            Products Ordered
                        </p>

                        <!-- Products table -->
                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%"
                               style="background-color: #0f1923; border-radius: 8px; border: 1px solid #2a3a4a;">

                            <!-- Table header -->
                            <tr>
                                <td style="padding: 12px 24px; border-bottom: 1px solid #2a3a4a;">
                                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                        <tr>
                                            <td width="40%"
                                                style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #5a6f82;">
                                                Product ID
                                            </td>
                                            <td width="20%" align="center"
                                                style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #5a6f82;">
                                                Quantity
                                            </td>
                                            <td width="40%" align="right"
                                                style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #5a6f82;">
                                                Price
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            {{productsTableRows}}

                        </table>

                        <!-- Total -->
                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%"
                               style="margin-top: 16px; background-color: #0f1923; border-radius: 8px; border: 1px solid #0d9f6e;">
                            <tr>
                                <td style="padding: 16px 24px;">
                                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                        <tr>
                                            <td align="left"
                                                style="font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #7a8fa3;">
                                                Total
                                            </td>
                                            <td align="right"
                                                style="font-size: 20px; font-weight: 700; color: #0d9f6e; letter-spacing: -0.3px;">
                                                {{totalPrice}} EUR
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="background-color: #141f2b; padding: 24px 40px; text-align: center;">
                        <p style="margin: 0 0 4px; font-size: 13px; color: #4a5e70;">
                            &copy; 2026 PowerCell46. All rights reserved.
                        </p>
                        <p style="margin: 0; font-size: 12px; color: #3a4e60;">
                            This is an automated order confirmation.
                        </p>
                    </td>
                </tr>

            </table>
            <!-- /Email container -->
        </td>
    </tr>
</table>

</body>
</html>
